spring.application.name=HotelProBackend

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:HotelProDevelopmentSecretKeyMustBeLongEnough123456}
app.jwt.expiration-ms=86400000

app.admin.email=${ADMIN_EMAIL:admin@hotelpro.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345!}
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
